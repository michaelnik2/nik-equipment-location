<!doctype html><html lang="es" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><title>The Nik Group - Asset Location Test</title><style>*{box-sizing:border-box}body{margin:0;background:#062f63;font-family:Arial,sans-serif;color:#fff;text-align:center}.card{max-width:520px;margin:auto;padding:26px 20px 42px}.brand{font-size:24px;font-weight:900}.sub{font-size:15px;opacity:.8}.num{font-size:56px;font-weight:900;margin:2px 0 3px}.desc{font-size:20px;font-weight:800;margin-bottom:20px}.panel{background:#fff;color:#082d60;border-radius:22px;padding:25px 18px}.icon{font-size:58px}.title{font-size:25px;font-weight:900;margin:5px 0 2px}.english{font-size:15px;color:#667085;margin:4px 0 8px;font-weight:700}.btn{width:100%;border:0;border-radius:16px;padding:20px 12px;font-weight:900;font-size:22px;margin-top:16px}.btn span{display:block;font-size:14px;margin-top:5px}.yellow{background:#ffd43b;color:#082d60}.green{background:#20a447;color:#fff}.blue{background:#e9f1fb;color:#082d60}.hide{display:none!important}.status{font-size:18px;font-weight:900;margin-top:16px}</style></head><body><div class="card"><div class="brand">THE NIK GROUP</div><div class="sub">ACTIVO / ASSET</div><div class="num" id="assetNum"></div><div class="desc" id="assetDesc"></div><div class="panel"><div id="locationStep"><div class="icon">📍</div><div class="title">REGISTRE LA UBICACIÓN</div><div class="english">REGISTER LOCATION</div><button class="btn yellow" id="locBtn">📍 REGISTRAR UBICACIÓN<span>REGISTER LOCATION</span></button><div id="status" class="status"></div></div><div id="photoStep" class="hide"><div class="icon">📸</div><div class="title">TOME UNA FOTO DE DÓNDE DEJÓ EL ACTIVO</div><div class="english">TAKE A PHOTO OF WHERE YOU LEFT THE ASSET</div><input id="photo" class="hide" type="file" accept="image/*" capture="environment"><button class="btn yellow" id="photoBtn">📸 TOMAR FOTO<span>TAKE PHOTO</span></button></div><div id="sendStep" class="hide"><div class="icon">✅</div><div class="title">FOTO LISTA</div><div class="english">PHOTO READY</div><div class="title">ELIJA CÓMO ENVIAR</div><div class="english">CHOOSE HOW TO SEND</div><button class="btn green" id="waBtn">🟢 ENVIAR POR WHATSAPP<span>SEND BY WHATSAPP</span></button><button class="btn blue" id="smsBtn">💬 ENVIAR POR TEXTO<span>SEND BY TEXT</span></button></div></div></div><script>const assets={'1099':'VEVOR 16" CONCRETE SAW','1100':'TEST GENERATOR'};const q=new URLSearchParams(location.search);let asset=q.get('asset')||'1099';if(!assets[asset])asset='1099';const description=assets[asset];assetNum.textContent='#'+asset;assetDesc.textContent=description;let body='',photoFile=null;const locationStep=document.getElementById('locationStep'),photoStep=document.getElementById('photoStep'),sendStep=document.getElementById('sendStep'),statusEl=document.getElementById('status'),photoInput=document.getElementById('photo');locBtn.onclick=function(){statusEl.innerHTML='Obteniendo ubicación...<div class="english">GETTING LOCATION...</div>';navigator.geolocation.getCurrentPosition(function(p){const maps='https://maps.google.com/?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);body='THE NIK GROUP - EQUIPMENT ASSET '+asset+'\n'+description+'\nCURRENT EQUIPMENT LOCATION:\n'+maps;locationStep.classList.add('hide');photoStep.classList.remove('hide');window.scrollTo(0,0)},function(){statusEl.innerHTML='⚠️ TOQUE PERMITIR PARA LA UBICACIÓN<div class="english">TAP ALLOW FOR LOCATION</div>'},{enableHighAccuracy:true,timeout:15000,maximumAge:0})};photoBtn.onclick=function(){photoInput.click()};async function doShare(){if(!photoFile)return;const data={title:'The Nik Group Asset '+asset,text:body,files:[photoFile]};if(navigator.canShare&&navigator.canShare({files:[photoFile]})){try{await navigator.share(data)}catch(e){}}}photoInput.addEventListener('change',async function(){if(!this.files||!this.files[0])return;photoFile=this.files[0];photoStep.classList.add('hide');sendStep.classList.remove('hide');window.scrollTo(0,document.body.scrollHeight);setTimeout(doShare,100)});waBtn.onclick=doShare;smsBtn.onclick=doShare;</script></body></html>
