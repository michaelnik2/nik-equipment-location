<!doctype html><html lang="es" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><title>The Nik Group - Asset Location Test</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b3d77 0%,#062f63 100%);font-family:Arial,sans-serif;color:#fff;text-align:center;min-height:100vh}.card{max-width:520px;margin:auto;padding:24px 18px 42px}.brand{font-size:26px;font-weight:900;letter-spacing:.5px;margin-top:4px}.sub{font-size:14px;opacity:.78;margin-top:5px;letter-spacing:.8px}.num{font-size:58px;font-weight:900;margin:4px 0 2px;line-height:1}.desc{font-size:19px;font-weight:800;margin:12px 8px 24px;line-height:1.2}.panel{background:#fff;color:#082d60;border-radius:28px;padding:28px 22px 24px;box-shadow:0 16px 34px rgba(0,0,0,.22)}.statusIcon{width:84px;height:84px;border-radius:24px;background:#eaf8ef;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:48px}.title{font-size:25px;font-weight:900;margin:4px 0 2px;line-height:1.08}.english{font-size:14px;color:#6b7280;margin:5px 0 10px;font-weight:700;letter-spacing:.2px}.divider{height:1px;background:#e8edf3;margin:20px 0}.choiceTitle{font-size:19px;font-weight:900;margin:0}.btn{width:100%;border:0;border-radius:19px;padding:18px 16px;font-weight:900;margin-top:14px;box-shadow:0 8px 18px rgba(0,0,0,.08);text-align:left;display:flex;align-items:center;gap:14px}.btn .appicon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:27px;flex:0 0 46px}.btn .copy{display:block;text-align:left}.btn .main{display:block;font-size:21px;line-height:1.05}.btn .small{display:block;font-size:13px;margin-top:5px;font-weight:700;opacity:.88}.yellow{background:#ffd43b;color:#082d60}.green{background:#20a447;color:#fff}.green .appicon{background:rgba(255,255,255,.18)}.blue{background:#edf4fb;color:#082d60;border:2px solid #d6e4f2}.blue .appicon{background:#fff}.hide{display:none!important}.status{font-size:18px;font-weight:900;margin-top:16px}</style></head><body><div class="card"><div class="brand">THE NIK GROUP</div><div class="sub">ACTIVO / ASSET</div><div class="num" id="assetNum"></div><div class="desc" id="assetDesc"></div><div class="panel"><div id="locationStep"><div class="statusIcon">📍</div><div class="title">REGISTRE LA UBICACIÓN</div><div class="english">REGISTER LOCATION</div><button class="btn yellow" id="locBtn"><span class="appicon">📍</span><span class="copy"><span class="main">REGISTRAR UBICACIÓN</span><span class="small">REGISTER LOCATION</span></span></button><div id="status" class="status"></div></div><div id="photoStep" class="hide"><div class="statusIcon">📸</div><div class="title">TOME UNA FOTO DE DÓNDE DEJÓ EL ACTIVO</div><div class="english">TAKE A PHOTO OF WHERE YOU LEFT THE ASSET</div><input id="photo" class="hide" type="file" accept="image/*" capture="environment"><button class="btn yellow" id="photoBtn"><span class="appicon">📸</span><span class="copy"><span class="main">TOMAR FOTO</span><span class="small">TAKE PHOTO</span></span></button></div><div id="sendStep" class="hide"><div class="statusIcon">✓</div><div class="title">FOTO LISTA</div><div class="english">PHOTO READY</div><div class="divider"></div><div class="choiceTitle">ELIJA CÓMO ENVIAR</div><div class="english">CHOOSE HOW TO SEND</div><button class="btn green" id="waBtn"><span class="appicon">☎</span><span class="copy"><span class="main">ENVIAR POR WHATSAPP</span><span class="small">SEND BY WHATSAPP</span></span></button><button class="btn blue" id="smsBtn"><span class="appicon">💬</span><span class="copy"><span class="main">ENVIAR POR TEXTO</span><span class="small">SEND BY TEXT</span></span></button></div></div></div><script>const assets={'1099':'VEVOR 16" CONCRETE SAW','1100':'TEST GENERATOR'};const q=new URLSearchParams(location.search);let asset=q.get('asset')||'1099';if(!assets[asset])asset='1099';const description=assets[asset];assetNum.textContent='#'+asset;assetDesc.textContent=description;let body='',photoFile=null;const locationStep=document.getElementById('locationStep'),photoStep=document.getElementById('photoStep'),sendStep=document.getElementById('sendStep'),statusEl=document.getElementById('status'),photoInput=document.getElementById('photo');locBtn.onclick=function(){statusEl.innerHTML='Obteniendo ubicación...<div class="english">GETTING LOCATION...</div>';navigator.geolocation.getCurrentPosition(function(p){const maps='https://maps.google.com/?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);body='THE NIK GROUP - EQUIPMENT ASSET '+asset+'\n'+description+'\nCURRENT EQUIPMENT LOCATION:\n'+maps;locationStep.classList.add('hide');photoStep.classList.remove('hide');window.scrollTo(0,0)},function(){statusEl.innerHTML='⚠️ TOQUE PERMITIR PARA LA UBICACIÓN<div class="english">TAP ALLOW FOR LOCATION</div>'},{enableHighAccuracy:true,timeout:15000,maximumAge:0})};photoBtn.onclick=function(){photoInput.click()};async function doShare(){if(!photoFile)return;const data={title:'The Nik Group Asset '+asset,text:body,files:[photoFile]};if(navigator.canShare&&navigator.canShare({files:[photoFile]})){try{await navigator.share(data)}catch(e){}}}photoInput.addEventListener('change',async function(){if(!this.files||!this.files[0])return;photoFile=this.files[0];photoStep.classList.add('hide');sendStep.classList.remove('hide');window.scrollTo(0,document.body.scrollHeight);setTimeout(doShare,100)});waBtn.onclick=doShare;smsBtn.onclick=doShare;</script></body></html>
