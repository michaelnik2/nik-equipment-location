<!doctype html><html lang="es" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><title>The Nik Group - Asset</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07366b,#06477f);font-family:Arial,sans-serif;min-height:100vh;color:#fff}.wrap{max-width:520px;margin:auto;padding:24px 18px 36px;text-align:center}.brand{font-size:27px;font-weight:900}.rule{width:40px;height:3px;background:#f3b61f;margin:10px auto 16px;border-radius:9px}.assetlabel{font-size:15px;font-weight:800;color:#45a9ff;letter-spacing:.5px}.assetlabel .enTop{color:#f4b51d}.num{font-size:62px;font-weight:900;line-height:1;margin:7px 0}.desc{font-size:20px;font-weight:800;margin:14px 0 24px}.panel{background:#fff;border-radius:28px;padding:30px 22px 25px;color:#0b396e;box-shadow:0 14px 32px #001b3d45}.iconbox{width:88px;height:88px;border-radius:24px;background:#edf5ff;margin:0 auto 21px;display:flex;align-items:center;justify-content:center;font-size:48px}.es{color:#0b396e;font-weight:900}.en{color:#e49a00;font-weight:800}.headline{font-size:26px;line-height:1.12}.subline{font-size:15px;margin-top:9px}.divider{width:40px;height:3px;background:#3499ef;margin:18px auto;border-radius:9px}.btn{width:100%;border:0;border-radius:20px;margin-top:18px;padding:18px 16px;display:grid;grid-template-columns:52px 1fr 22px;align-items:center;text-align:left;box-shadow:0 8px 18px #001b3d20;color:#fff}.btnIcon{width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:29px}.btnText{padding-left:6px}.btnEs{display:block;font-size:21px;line-height:1.08;font-weight:900;color:#fff}.btnEn{display:block;font-size:14px;margin-top:6px;font-weight:700;color:#eaf2f8}.arrow{font-size:29px;color:#fff}.loc{background:#1166b8}.photo{background:#14834a}.wa{background:#20a84b}.sms{background:#6553c7}.hide{display:none!important}.waLogo{width:43px;height:43px}.waLogo circle{fill:#fff}.waLogo path{fill:#20a84b}.steps{display:flex;justify-content:center;gap:20px;margin:20px 0 0}.dot{width:30px;height:30px;border:1.5px solid #9fb9d2;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#dce8f4}.active1{background:#1686eb;border-color:#1686eb;color:#fff}.active2{background:#18a358;border-color:#18a358;color:#fff}.active3{background:#6d58d2;border-color:#6d58d2;color:#fff}.status{margin-top:14px;font-weight:800;color:#0b396e}</style></head><body><div class="wrap"><div class="brand">THE NIK GROUP</div><div class="rule"></div><div class="assetlabel">ACTIVO <span class="enTop">/ ASSET</span></div><div class="num" id="assetNum"></div><div class="desc" id="assetDesc"></div><div class="panel"><section id="locationStep"><div class="iconbox">📍</div><div class="headline es">REGISTRE LA UBICACIÓN</div><div class="divider"></div><div class="subline en">REGISTER LOCATION</div><button class="btn loc" id="locBtn"><span class="btnIcon">📍</span><span class="btnText"><span class="btnEs">REGISTRAR UBICACIÓN</span><span class="btnEn">REGISTER LOCATION</span></span><span class="arrow">›</span></button><div id="status" class="status"></div></section><section id="photoStep" class="hide"><div class="iconbox">📸</div><div class="headline es">TOME UNA FOTO DE DÓNDE DEJÓ EL ACTIVO</div><div class="divider"></div><div class="subline en">TAKE A PHOTO OF WHERE YOU LEFT THE ASSET</div><input id="photoInput" class="hide" type="file" accept="image/*" capture="environment"><button class="btn photo" id="photoBtn"><span class="btnIcon">📷</span><span class="btnText"><span class="btnEs">TOMAR FOTO</span><span class="btnEn">TAKE PHOTO</span></span><span class="arrow">›</span></button></section><section id="sendStep" class="hide"><div class="iconbox">✓</div><div class="headline es">FOTO LISTA</div><div class="subline en">PHOTO READY</div><div class="divider"></div><div class="headline es" style="font-size:21px">ELIJA CÓMO ENVIAR</div><div class="subline en">CHOOSE HOW TO SEND</div><button class="btn wa" id="waBtn"><span class="btnIcon"><svg class="waLogo" viewBox="0 0 32 32" aria-label="WhatsApp"><circle cx="16" cy="16" r="15"/><path d="M23.3 8.7A10.2 10.2 0 0 0 7.2 21l-1.4 5.1 5.2-1.4a10.2 10.2 0 0 0 12.3-16zm-7.2 15.7c-1.7 0-3.3-.5-4.7-1.3l-.3-.2-3.1.8.8-3-.2-.3a8.3 8.3 0 1 1 7.5 4zm4.6-6.2c-.3-.1-1.6-.8-1.9-.9-.3-.1-.5-.1-.7.2-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-1.6-.8-2.7-1.5-3.8-3.4-.3-.5.3-.5.8-1.6.1-.2 0-.4 0-.6l-.9-2.1c-.2-.5-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9s1.2 3.3 1.4 3.6c.2.2 2.4 3.7 5.9 5.2 2.2.9 3.1 1 4.2.8.7-.1 1.6-.7 1.9-1.3.2-.6.2-1.2.2-1.3-.1-.2-.3-.3-.6-.4z"/></svg></span><span class="btnText"><span class="btnEs">ENVIAR POR WHATSAPP</span><span class="btnEn">SEND BY WHATSAPP</span></span><span class="arrow">›</span></button><button class="btn sms" id="smsBtn"><span class="btnIcon">💬</span><span class="btnText"><span class="btnEs">ENVIAR POR TEXTO</span><span class="btnEn">SEND BY TEXT</span></span><span class="arrow">›</span></button></section></div><div class="steps"><span class="dot active1" id="d1">1</span><span class="dot" id="d2">2</span><span class="dot" id="d3">3</span></div></div><script>const descriptions={'1099':'VEVOR 16" CONCRETE SAW','1100':'TEST GENERATOR'};const q=new URLSearchParams(location.search);let asset=q.get('asset')||'1099';const assetNumber=Number(asset);if(!Number.isInteger(assetNumber)||assetNumber<1099||assetNumber>1198)asset='1099';const description=descriptions[asset]||'EQUIPMENT ASSET';assetNum.textContent='#'+asset;assetDesc.textContent=description;let body='',photoFile=null;const locationStep=document.getElementById('locationStep'),photoStep=document.getElementById('photoStep'),sendStep=document.getElementById('sendStep'),photoInput=document.getElementById('photoInput');function step(n){d1.className='dot'+(n===1?' active1':'');d2.className='dot'+(n===2?' active2':'');d3.className='dot'+(n===3?' active3':'')}locBtn.onclick=()=>{status.textContent='Obteniendo ubicación...';navigator.geolocation.getCurrentPosition(p=>{const maps='https://maps.google.com/?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);body='THE NIK GROUP - EQUIPMENT ASSET '+asset+'\n'+description+'\nCURRENT EQUIPMENT LOCATION:\n'+maps;locationStep.classList.add('hide');photoStep.classList.remove('hide');step(2);scrollTo(0,0)},()=>{status.textContent='⚠️ Toque PERMITIR para ubicación.'},{enableHighAccuracy:true,timeout:15000,maximumAge:0})};photoBtn.onclick=()=>photoInput.click();async function share(){if(!photoFile)return;const data={title:'The Nik Group Asset '+asset,text:body,files:[photoFile]};if(navigator.canShare&&navigator.canShare({files:[photoFile]})){try{await navigator.share(data)}catch(e){}}}photoInput.onchange=function(){if(!this.files?.[0])return;photoFile=this.files[0];photoStep.classList.add('hide');sendStep.classList.remove('hide');step(3);scrollTo(0,0)};waBtn.onclick=share;smsBtn.onclick=share;</script></body></html>
