<!doctype html><html lang="es" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="google" content="notranslate"><title>Option 2</title><style>*{box-sizing:border-box}body{margin:0;background:#073b70;font-family:Arial;color:#fff}.w{max-width:520px;margin:auto;padding:25px 18px 34px;text-align:center}.brand{font-size:27px;font-weight:900}.asset{font-size:15px;color:#45a9ff;font-weight:800}.asset b{color:#f4b51d}.n{font-size:62px;font-weight:900;line-height:1;margin:8px 0}.d{font-size:20px;font-weight:800;margin:14px 0 25px}.c{background:#fff;color:#073b70;border-radius:28px;padding:30px 22px}.icon{font-size:52px}.es{font-size:27px;font-weight:900;margin-top:14px}.en{font-size:15px;font-weight:800;color:#d99a00;margin-top:8px}.btn{position:relative;width:100%;min-height:94px;border:0;border-radius:22px;padding:25px 22px 20px;margin-top:24px;text-align:center;color:white;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.btn>*{pointer-events:none}.loc{background:#1166b8}.photo{background:#17884c}.wa{background:#20a84b}.sms{background:#6553c7}.badge{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:15px;background:#fff;color:#073b70;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:900}.bt{font-size:21px;font-weight:900}.small{font-size:13px;margin-top:6px;color:#eef3f8}.hide{display:none!important}.status{color:#073b70;margin-top:12px;font-weight:bold}.waLogo{width:36px;vertical-align:middle;margin-right:8px}.waLogo circle{fill:#fff}.waLogo path{fill:#20a84b}</style></head><body><div class=w><div class=brand>THE NIK GROUP</div><div class=asset>ACTIVO <b>/ ASSET</b></div><div class=n id=assetNum></div><div class=d id=assetDesc></div><div class=c><section id=s1><div class=icon>📍</div><div class=es>REGISTRE LA UBICACIÓN</div><div class=en>REGISTER LOCATION</div><button class="btn loc" id=locBtn type="button"><span class=badge>1</span><div class=bt>📍 REGISTRAR UBICACIÓN</div><div class=small>REGISTER LOCATION</div></button><div id=status class=status></div></section><section id=s2 class=hide><div class=icon>📸</div><div class=es>TOME UNA FOTO DE DÓNDE DEJÓ EL ACTIVO</div><div class=en>TAKE A PHOTO OF WHERE YOU LEFT THE ASSET</div><input id=photoInput class=hide type=file accept="image/*" capture="environment"><button class="btn photo" id=photoBtn type="button"><span class=badge>2</span><div class=bt>📷 TOMAR FOTO</div><div class=small>TAKE PHOTO</div></button></section><section id=s3 class=hide><div class=icon>✓</div><div class=es>FOTO LISTA</div><div class=en>PHOTO READY</div><div class=es style="font-size:21px;margin-top:20px">ELIJA CÓMO ENVIAR</div><div class=en>CHOOSE HOW TO SEND</div><button class="btn wa" id=waBtn type="button"><span class=badge>3</span><div class=bt><svg class=waLogo viewBox="0 0 32 32"><circle cx="16" cy="16" r="15"/><path d="M23.3 8.7A10.2 10.2 0 0 0 7.2 21l-1.4 5.1 5.2-1.4a10.2 10.2 0 0 0 12.3-16zm-7.2 15.7c-1.7 0-3.3-.5-4.7-1.3l-.3-.2-3.1.8.8-3-.2-.3a8.3 8.3 0 1 1 7.5 4z"/></svg> ENVIAR POR WHATSAPP</div><div class=small>SEND BY WHATSAPP</div></button><button class="btn sms" id=smsBtn type="button"><span class=badge>3</span><div class=bt>💬 ENVIAR POR TEXTO</div><div class=small>SEND BY TEXT</div></button></section></div></div><script>const assets={'1099':'VEVOR 16" CONCRETE SAW','1100':'TEST GENERATOR'};const q=new URLSearchParams(location.search);let a=q.get('asset')||'1099';if(!assets[a])a='1099';assetNum.textContent='#'+a;assetDesc.textContent=assets[a];let body='',f=null;const locBtn=document.getElementById('locBtn'),photoBtn=document.getElementById('photoBtn'),waBtn=document.getElementById('waBtn'),smsBtn=document.getElementById('smsBtn'),photoInput=document.getElementById('photoInput'),statusEl=document.getElementById('status'),s1=document.getElementById('s1'),s2=document.getElementById('s2'),s3=document.getElementById('s3');locBtn.addEventListener('click',()=>{statusEl.textContent='Obteniendo ubicación...';navigator.geolocation.getCurrentPosition(p=>{body='THE NIK GROUP - EQUIPMENT ASSET '+a+'\n'+assets[a]+'\nCURRENT EQUIPMENT LOCATION:\nhttps://maps.google.com/?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);s1.classList.add('hide');s2.classList.remove('hide');scrollTo(0,0)},()=>statusEl.textContent='⚠️ Toque PERMITIR para ubicación.',{enableHighAccuracy:true,timeout:15000,maximumAge:0})});photoBtn.addEventListener('click',()=>photoInput.click());photoInput.addEventListener('change',function(){if(!this.files?.[0])return;f=this.files[0];s2.classList.add('hide');s3.classList.remove('hide');scrollTo(0,0)});async function send(){if(f&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({title:'The Nik Group Asset '+a,text:body,files:[f]})}catch(e){}}}waBtn.addEventListener('click',send);smsBtn.addEventListener('click',send);</script></body></html>
