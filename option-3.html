<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Option 3</title><style>*{box-sizing:border-box}body{margin:0;background:#073b70;font-family:Arial;color:white}.w{max-width:520px;margin:auto;padding:26px 18px;text-align:center}.n{font-size:62px;font-weight:900}.d{font-size:20px;font-weight:800;margin:12px 0 25px}.c{background:white;color:#073b70;border-radius:28px;padding:30px 22px}.icon{font-size:50px}.stepTitle{font-size:16px;font-weight:900;color:#2795ed;letter-spacing:1px;margin-bottom:10px}.es{font-size:27px;font-weight:900}.en{font-size:15px;font-weight:800;color:#d99a00;margin-top:8px}.btn{width:100%;border:0;border-radius:22px;padding:19px;margin-top:22px;color:white;text-align:center}.loc{background:#1166b8}.photo{background:#17884c}.wa{background:#20a84b}.sms{background:#6553c7}.bt{font-size:22px;font-weight:900}.small{font-size:13px;margin-top:6px;color:#eef3f8}.hide{display:none}.status{color:#073b70;margin-top:12px;font-weight:bold}</style></head><body><div class=w><h1>THE NIK GROUP</h1><div>ACTIVO / ASSET</div><div class=n>#1099</div><div class=d>VEVOR 16&quot; CONCRETE SAW</div><div class=c><section id=s1><div class=stepTitle>PASO 1 · STEP 1</div><div class=icon>📍</div><div class=es>REGISTRE LA UBICACIÓN</div><div class=en>REGISTER LOCATION</div><button class="btn loc" id=locBtn><div class=bt>① &nbsp; 📍 REGISTRAR UBICACIÓN</div><div class=small>REGISTER LOCATION</div></button><div id=status class=status></div></section><section id=s2 class=hide><div class=stepTitle>PASO 2 · STEP 2</div><div class=icon>📸</div><div class=es>TOME UNA FOTO DE DÓNDE DEJÓ EL ACTIVO</div><div class=en>TAKE A PHOTO OF WHERE YOU LEFT THE ASSET</div><input id=photoInput class=hide type=file accept="image/*" capture="environment"><button class="btn photo" id=photoBtn><div class=bt>② &nbsp; 📷 TOMAR FOTO</div><div class=small>TAKE PHOTO</div></button></section><section id=s3 class=hide><div class=stepTitle>PASO 3 · STEP 3</div><div class=icon>✓</div><div class=es>FOTO LISTA</div><div class=en>PHOTO READY</div><div class=es style="font-size:21px;margin-top:20px">ELIJA CÓMO ENVIAR</div><div class=en>CHOOSE HOW TO SEND</div><button class="btn wa" id=waBtn><div class=bt>③ &nbsp; ◉ ENVIAR POR WHATSAPP</div><div class=small>SEND BY WHATSAPP</div></button><button class="btn sms" id=smsBtn><div class=bt>③ &nbsp; 💬 ENVIAR POR TEXTO</div><div class=small>SEND BY TEXT</div></button></section></div></div><script>let body='',f=null;locBtn.onclick=()=>{status.textContent='Obteniendo ubicación...';navigator.geolocation.getCurrentPosition(p=>{body='THE NIK GROUP - EQUIPMENT ASSET 1099\nVEVOR 16" CONCRETE SAW\nCURRENT EQUIPMENT LOCATION:\nhttps://maps.google.com/?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);s1.classList.add('hide');s2.classList.remove('hide');scrollTo(0,0)},()=>status.textContent='⚠️ Toque PERMITIR para ubicación.')};photoBtn.onclick=()=>photoInput.click();photoInput.onchange=function(){if(!this.files?.[0])return;f=this.files[0];s2.classList.add('hide');s3.classList.remove('hide');scrollTo(0,0)};async function send(){if(f&&navigator.canShare&&navigator.canShare({files:[f]}))try{await navigator.share({text:body,files:[f]})}catch(e){}}waBtn.onclick=send;smsBtn.onclick=send;</script></body></html>
