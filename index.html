<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Nik Group - Asset Location</title><style>*{box-sizing:border-box}body{margin:0;background:#062f63;font-family:Arial,sans-serif;color:#fff;text-align:center}.card{max-width:520px;margin:auto;padding:26px 20px 42px}.brand{font-size:24px;font-weight:900}.sub{font-size:15px;opacity:.8}.num{font-size:56px;font-weight:900;margin:2px 0 3px}.desc{font-size:20px;font-weight:800;margin-bottom:20px}.panel{background:#fff;color:#082d60;border-radius:22px;padding:25px 18px}.icon{font-size:58px}.title{font-size:25px;font-weight:900;margin:5px 0 8px}.english{font-size:14px;color:#667085;margin-top:5px}.btn{width:100%;border:0;border-radius:16px;padding:20px 12px;font-weight:900;font-size:22px;margin-top:18px}.yellow{background:#ffd43b;color:#082d60}.green{background:#20a447;color:#fff}.blue{background:#e9f1fb;color:#082d60}.status{font-size:18px;font-weight:900;margin-top:16px}.hide{display:none}#preview{width:100%;max-height:280px;object-fit:cover;border-radius:14px;margin-top:15px}</style></head><body><div class="card"><div class="brand">THE NIK GROUP</div><div class="sub">ACTIVO / ASSET</div><div class="num" id="assetNum"></div><div class="desc" id="assetDesc"></div><div class="panel"><div id="locationStep"><div class="icon">📍</div><div class="title">REGISTRE LA UBICACIÓN</div><div class="english">REGISTER LOCATION</div><button class="btn yellow" onclick="getLocation()">📍 REGISTRAR UBICACIÓN</button><div id="status" class="status"></div></div><div id="photoStep" class="hide"><div class="icon">📸</div><div class="title">TOME UNA FOTO DE DÓNDE DEJÓ EL ACTIVO</div><div class="english">TAKE A PHOTO OF WHERE YOU LEFT THE ASSET</div><input id="photo" class="hide" type="file" accept="image/*" capture="environment" onchange="photoReady(event)"><button class="btn yellow" onclick="document.getElementById('photo').click()">📸 TOMAR FOTO</button><img id="preview" class="hide"><div id="photoOK" class="status"></div></div><div id="sendStep" class="hide"><div class="title">✓ LISTO PARA ENVIAR</div><div class="english">READY TO SEND</div><button class="btn green" onclick="shareAll()">📤 COMPARTIR FOTO + UBICACIÓN</button><button class="btn blue" onclick="sendTextOnly()">💬 ENVIAR TEXTO SOLAMENTE</button></div></div></div><script>const assets={'1099':'VEVOR 16" CONCRETE SAW','1100':'TEST GENERATOR'};const q=new URLSearchParams(location.search);let asset=q.get('asset')||'1099';if(!assets[asset])asset='1099';const description=assets[asset];assetNum.textContent='#'+asset;assetDesc.textContent=description;let body='',photoFile=null;function getLocation(){status.textContent='Obteniendo ubicación...';navigator.geolocation.getCurrentPosition(p=>{let maps='https://maps.google.com/?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);body='THE NIK GROUP - EQUIPMENT ASSET '+asset+'\n'+description+'\nCURRENT EQUIPMENT LOCATION:\n'+maps;locationStep.classList.add('hide');photoStep.classList.remove('hide')},()=>{status.innerHTML='⚠️ TOQUE <b>PERMITIR</b> PARA LA UBICACIÓN<div class="english">TAP ALLOW FOR LOCATION</div>'},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}function photoReady(e){photoFile=e.target.files[0];if(!photoFile)return;preview.src=URL.createObjectURL(photoFile);preview.classList.remove('hide');photoOK.textContent='✓ FOTO LISTA';sendStep.classList.remove('hide')}async function shareAll(){if(!photoFile)return;let data={title:'The Nik Group Asset '+asset,text:body,files:[photoFile]};if(navigator.canShare&&navigator.canShare({files:[photoFile]})){try{await navigator.share(data);return}catch(e){if(e.name==='AbortError')return}}alert('Use the share button on your phone to send the photo, then send the location message.')}function sendTextOnly(){location.href='sms:8186403863?body='+encodeURIComponent(body)}</script></body></html>
