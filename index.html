<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Nik Group - Asset Location</title><style>*{box-sizing:border-box}body{margin:0;background:#062f63;font-family:Arial,sans-serif;color:#fff;text-align:center}.card{max-width:520px;margin:auto;padding:26px 20px 42px}.brand{font-size:24px;font-weight:900}.sub{font-size:15px;opacity:.8;margin-top:3px}.num{font-size:56px;font-weight:900;margin:2px 0 3px}.desc{font-size:20px;font-weight:800;margin-bottom:20px}.panel{background:#fff;color:#082d60;border-radius:22px;padding:25px 18px}.pin{font-size:58px}.question{font-size:25px;font-weight:900;margin:5px 0 7px}.explain{font-size:17px;color:#4b5563;line-height:1.3;margin:0 8px 20px}.english{font-size:14px;color:#667085;margin-top:5px}.share,.wa,.sms{width:100%;border:0;border-radius:16px;padding:20px 12px;font-weight:900}.share{background:#ffd43b;color:#082d60;font-size:24px}.share small,.wa small,.sms small{display:block;font-size:14px;margin-top:5px}.status{font-size:18px;font-weight:900;margin:18px 0}.choice{display:none}.ready{font-size:25px;font-weight:900;color:#17813a}.wa{background:#20a447;color:#fff;font-size:23px;margin-top:15px}.sms{background:#e9f1fb;color:#082d60;font-size:21px;margin-top:11px}</style></head><body><div class="card"><div class="brand">THE NIK GROUP</div><div class="sub">ACTIVO / ASSET</div><div class="num" id="assetNum"></div><div class="desc" id="assetDesc"></div><div class="panel"><div id="start"><div class="pin">📍</div><div class="question">REGISTRE LA UBICACIÓN DE ESTE ACTIVO</div><div class="explain">Esto nos ayuda a saber dónde está y mantener nuestros activos localizados.<div class="english">Register this asset's location so we can keep track of it.</div></div><button class="share" onclick="getLocation()">📍 REGISTRAR UBICACIÓN<small>REGISTER LOCATION</small></button><div id="status" class="status"></div></div><div id="choice" class="choice"><div class="ready">✓ UBICACIÓN REGISTRADA</div><div class="english">Location recorded</div><button class="wa" onclick="sendWA()">🟢 ENVIAR POR WHATSAPP<small>SEND WITH WHATSAPP</small></button><button class="sms" onclick="sendSMS()">💬 ENVIAR POR TEXTO<small>SEND WITH TEXT MESSAGE</small></button></div></div></div><script>const assets={'1099':'VEVOR 16" CONCRETE SAW','1100':'TEST GENERATOR'};const q=new URLSearchParams(location.search);let asset=q.get('asset')||'1099';if(!assets[asset]) asset='1099';const description=assets[asset];document.getElementById('assetNum').textContent='#'+asset;document.getElementById('assetDesc').textContent=description;let body='';function getLocation(){const s=document.getElementById('status');s.textContent='Obteniendo ubicación...';navigator.geolocation.getCurrentPosition(function(p){const lat=p.coords.latitude.toFixed(6),lon=p.coords.longitude.toFixed(6),maps='https://maps.google.com/?q='+lat+','+lon;body='THE NIK GROUP - EQUIPMENT ASSET '+asset+'\n'+description+'\nCURRENT EQUIPMENT LOCATION:\n'+maps;document.getElementById('start').style.display='none';document.getElementById('choice').style.display='block'},function(){s.innerHTML='⚠️ TOQUE <b>PERMITIR</b> PARA LA UBICACIÓN<div class="english">Tap ALLOW for location</div>'},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}function sendWA(){location.href='https://wa.me/18186403863?text='+encodeURIComponent(body)}function sendSMS(){location.href='sms:8186403863?body='+encodeURIComponent(body)}</script></body></html>
