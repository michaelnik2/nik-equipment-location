<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Nik Group - Activo 1099</title><style>*{box-sizing:border-box}body{margin:0;background:#062f63;font-family:Arial,sans-serif;color:#fff;text-align:center}.card{max-width:520px;margin:auto;padding:26px 20px 42px}.brand{font-size:24px;font-weight:900;letter-spacing:.5px}.sub{font-size:15px;opacity:.8;margin-top:3px}.num{font-size:56px;font-weight:900;margin:2px 0 22px}.panel{background:#fff;color:#082d60;border-radius:22px;padding:25px 18px;box-shadow:0 8px 24px rgba(0,0,0,.22)}.pin{font-size:58px}.question{font-size:25px;font-weight:900;margin:5px 0 7px}.explain{font-size:17px;color:#4b5563;line-height:1.3;margin:0 8px 20px}.english{font-size:14px;color:#667085;margin-top:5px}.share,.wa,.sms{width:100%;border:0;border-radius:16px;padding:20px 12px;font-weight:900;cursor:pointer}.share{background:#ffd43b;color:#082d60;font-size:24px}.share small,.wa small,.sms small{display:block;font-size:14px;margin-top:5px;font-weight:700}.status{font-size:18px;font-weight:900;margin:18px 0 4px}.choice{display:none}.ready{font-size:25px;font-weight:900;color:#17813a;margin:12px 0 3px}.wa{background:#20a447;color:#fff;font-size:23px;margin-top:15px}.sms{background:#e9f1fb;color:#082d60;font-size:21px;margin-top:11px}</style></head><body><div class="card"><div class="brand">THE NIK GROUP</div><div class="sub">ACTIVO / ASSET</div><div class="num">#1099</div><div class="panel"><div id="start"><div class="pin">📍</div><div class="question">REGISTRE LA UBICACIÓN DE ESTE ACTIVO</div><div class="explain">Esto nos ayuda a saber dónde está y mantener nuestros equipos localizados.<div class="english">Register this asset's location so we can keep track of our equipment.</div></div><button class="share" onclick="getLocation()">📍 REGISTRAR UBICACIÓN<small>REGISTER LOCATION</small></button><div id="status" class="status"></div></div><div id="choice" class="choice"><div class="ready">✓ UBICACIÓN REGISTRADA</div><div class="english">Location recorded</div><button class="wa" onclick="sendWA()">🟢 ENVIAR POR WHATSAPP<small>SEND WITH WHATSAPP</small></button><button class="sms" onclick="sendSMS()">💬 ENVIAR POR TEXTO<small>SEND WITH TEXT MESSAGE</small></button></div></div></div><script>let body='';function getLocation(){const s=document.getElementById('status');s.textContent='Obteniendo ubicación...';navigator.geolocation.getCurrentPosition(function(p){const lat=p.coords.latitude.toFixed(6),lon=p.coords.longitude.toFixed(6),maps='https://maps.google.com/?q='+lat+','+lon;body='THE NIK GROUP - EQUIPMENT ASSET 1099\nCURRENT EQUIPMENT LOCATION:\n'+maps;document.getElementById('start').style.display='none';document.getElementById('choice').style.display='block';},function(){s.innerHTML='⚠️ TOQUE <b>PERMITIR</b> PARA LA UBICACIÓN<div class="english">Tap ALLOW for location</div>';},{enableHighAccuracy:true,timeout:15000,maximumAge:0});}function sendWA(){window.location.href='https://wa.me/18186403863?text='+encodeURIComponent(body)}function sendSMS(){window.location.href='sms:8186403863?body='+encodeURIComponent(body)}</script></body></html>
