<!doctype html><html lang="es" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="google" content="notranslate"><title>Option 1</title><style>*{box-sizing:border-box}body{margin:0;background:#073b70;font-family:Arial;color:white}.w{max-width:520px;margin:auto;padding:26px 18px 34px;text-align:center}.brand{font-size:27px;font-weight:900}.asset{font-size:15px;color:#45a9ff;font-weight:800}.asset b{color:#f4b51d}.n{font-size:62px;font-weight:900;line-height:1;margin:8px 0}.d{font-size:20px;font-weight:800;margin:14px 0 24px}.c{background:white;color:#073b70;border-radius:28px;padding:30px 22px}.icon{font-size:50px}.es{font-size:27px;font-weight:900;margin-top:15px}.en{font-size:15px;font-weight:800;color:#d99a00;margin-top:8px}.btn{width:100%;min-height:96px;border:0;border-radius:20px;padding:18px 16px;margin-top:24px;display:grid;grid-template-columns:58px 48px 1fr 18px;gap:10px;align-items:center;text-align:left;color:white;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;position:relative}.btn>*{pointer-events:none}.loc{background:#1166b8}.photo{background:#17884c}.wa{background:#20a84b}.sms{background:#6553c7}.num{width:58px;height:58px;border-radius:50%;background:white;color:#073b70;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900}.bt{font-size:20px;font-weight:900}.small{font-size:13px;color:#edf2f6;margin-top:5px;font-weight:700}.arr{font-size:28px}.hide{display:none!important}.status{color:#073b70;margin-top:14px;font-weight:800}.waLogo{width:42px;height:42px}.waLogo circle{fill:#fff}.waLogo path{fill:#20a84b}</style></head><body><div class=w><div class=brand>THE NIK GROUP</div><div class=asset>ACTIVO <b>/ ASSET</b></div><div class=n id=assetNum></div><div class=d id=assetDesc></div><div class=c><section id=s1><div class=icon>📍</div><div class=es>REGISTRE LA UBICACIÓN</div><div class=en>REGISTER LOCATION</div><button class="btn loc" id=locBtn type="button"><span class=num>1</span><span>📍</span><span><span class=bt>REGISTRAR UBICACIÓN</span><span class=small>REGISTER LOCATION</span></span><span class=arr>›</span></button><div id=status class=status></div></section><section id=s2 class=hide><div class=icon>📸</div><div class=es>TOME UNA FOTO DE DÓNDE DEJÓ EL ACTIVO</div><div class=en>TAKE A PHOTO OF WHERE YOU LEFT THE ASSET</div><input id=photoInput class=hide type=file accept="image/*" capture="environment"><button class="btn photo" id=photoBtn type="button"><span class=num>2</span><span>📷</span><span><span class=bt>TOMAR FOTO</span><span class=small>TAKE PHOTO</span></span><span class=arr>›</span></button></section><section id=s3 class=hide><div class=icon>✓</div><div class=es>FOTO LISTA</div><div class=en>PHOTO READY</div><div class=es style="font-size:22px;margin-top:20px">ELIJA CÓMO ENVIAR</div><div class=en>CHOOSE HOW TO SEND</div><button class="btn wa" id=waBtn type="button"><span class=num>3</span><span><svg class=waLogo viewBox="0 0 32 32"><circle cx="16" cy="16" r="15"/><path d="M23.3 8.7A10.2 10.2 0 0 0 7.2 21l-1.4 5.1 5.2-1.4a10.2 10.2 0 0 0 12.3-16zm-7.2 15.7c-1.7 0-3.3-.5-4.7-1.3l-.3-.2-3.1.8.8-3-.2-.3a8.3 8.3 0 1 1 7.5 4z"/></svg></span><span><span class=bt>ENVIAR POR WHATSAPP</span><span class=small>SEND BY WHATSAPP</span></span><span class=arr>›</span></button><button class="btn sms" id=smsBtn type="button"><span class=num>3</span><span>💬</span><span><span class=bt>ENVIAR POR TEXTO</span><span class=small>SEND BY TEXT</span></span><span class=arr>›</span></button></section></div></div><script>const assets={'1099':'VEVOR 16" CONCRETE SAW','1100':'TEST GENERATOR'};const q=new URLSearchParams(location.search);let a=q.get('asset')||'1099';if(!assets[a])a='1099';assetNum.textContent='#'+a;assetDesc.textContent=assets[a];let body='',photoFile=null;const locBtn=document.getElementById('locBtn'),photoBtn=document.getElementById('photoBtn'),waBtn=document.getElementById('waBtn'),smsBtn=document.getElementById('smsBtn'),photoInput=document.getElementById('photoInput'),statusEl=document.getElementById('status'),s1=document.getElementById('s1'),s2=document.getElementById('s2'),s3=document.getElementById('s3');locBtn.addEventListener('click',()=>{statusEl.textContent='Obteniendo ubicación...';navigator.geolocation.getCurrentPosition(p=>{body='THE NIK GROUP - EQUIPMENT ASSET '+a+'\n'+assets[a]+'\nCURRENT EQUIPMENT LOCATION:\nhttps://maps.google.com/?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);s1.classList.add('hide');s2.classList.remove('hide');scrollTo(0,0)},()=>statusEl.textContent='⚠️ Toque PERMITIR para ubicación.',{enableHighAccuracy:true,timeout:15000,maximumAge:0})});photoBtn.addEventListener('click',()=>photoInput.click());photoInput.addEventListener('change',function(){if(!this.files?.[0])return;photoFile=this.files[0];s2.classList.add('hide');s3.classList.remove('hide');scrollTo(0,0)});async function share(){if(!photoFile)return;const data={title:'The Nik Group Asset '+a,text:body,files:[photoFile]};if(navigator.canShare&&navigator.canShare({files:[photoFile]})){try{await navigator.share(data)}catch(e){}}}waBtn.addEventListener('click',share);smsBtn.addEventListener('click',share);</script></body></html>
